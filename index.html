<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Call with Gabe</title>
<meta name="description" content="Grab a time on Gabe Schillinger's calendar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070a;
    --fg: #f4f2ee;
    --muted: #8d8a93;
    --line: rgba(255,255,255,.06);
    --line-hot: rgba(255,196,120,.55);
    --red: #ff3d2e;
    --gold: #ffb547;
    --mx: 50vw;
    --my: 30vh;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  html { overflow-x: clip; }
  body {
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Background: dim grid + cursor-revealed hot grid ---------- */
  .grid, .grid-hot {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 56px 56px;
    background-position: center top;
  }
  .grid-hot {
    background-image:
      linear-gradient(var(--line-hot) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-hot) 1px, transparent 1px);
    -webkit-mask-image: radial-gradient(260px circle at var(--mx) var(--my), #000 0%, transparent 70%);
            mask-image: radial-gradient(260px circle at var(--mx) var(--my), #000 0%, transparent 70%);
  }
  .glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(600px circle at var(--mx) var(--my), rgba(255,120,60,.10), transparent 60%);
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 50% 0%, transparent 30%, var(--bg) 85%);
  }
  canvas#sparks { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* ---------- Layout ---------- */
  main {
    position: relative; z-index: 2;
    max-width: 880px; margin: 0 auto;
    padding: clamp(48px, 10vh, 112px) 16px 80px;
    text-align: center;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted);
    padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: rgba(255,255,255,.02);
    backdrop-filter: blur(6px);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #3dff8a;
    box-shadow: 0 0 0 0 rgba(61,255,138,.6);
    animation: ping 2s infinite;
  }
  @keyframes ping { 70% { box-shadow: 0 0 0 9px rgba(61,255,138,0); } 100% { box-shadow: 0 0 0 0 rgba(61,255,138,0); } }

  h1 {
    margin-top: 28px;
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: clamp(44px, 9vw, 96px);
    line-height: .98;
    letter-spacing: -.02em;
  }
  h1 .w { display: inline-block; white-space: pre; }
  h1 .c {
    display: inline-block;
    opacity: 0; filter: blur(14px); transform: translateY(.35em) rotateX(70deg);
    transform-origin: 50% 100%;
    animation: in .9s cubic-bezier(.2,.7,.1,1) forwards;
  }
  h1 em {
    font-style: italic;
    background: linear-gradient(100deg, var(--gold) 0%, #fff3d9 30%, var(--red) 55%, var(--gold) 80%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 6s linear infinite;
  }
  /* while animating, each gradient char paints its own slice; once done we swap to one clean text run */
  h1 em .c {
    background: linear-gradient(100deg, var(--gold), #fff3d9, var(--red));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  @keyframes in { to { opacity: 1; filter: blur(0); transform: none; } }
  @keyframes shine { to { background-position: -250% 0; } }

  .sub {
    max-width: 520px; margin: 22px auto 0;
    color: var(--muted); font-size: clamp(16px, 2.2vw, 18px); line-height: 1.55;
    opacity: 0; filter: blur(8px); animation: in 1s .9s forwards;
  }
  .sub b { color: var(--fg); font-weight: 500; }

  /* ---------- Calendar frame: spinning red/gold conic border ---------- */
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .frame-wrap {
    margin-top: 48px;
    perspective: 1400px;
    opacity: 0; transform: translateY(30px);
    animation: rise 1s 1.2s cubic-bezier(.2,.7,.1,1) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .frame {
    position: relative;
    border-radius: 22px;
    padding: 1.5px;
    background: conic-gradient(from var(--a), transparent 0deg, var(--red) 60deg, var(--gold) 110deg, transparent 170deg, transparent 360deg);
    animation: spin 5s linear infinite;
  }
  @keyframes spin { to { --a: 360deg; } }
  .frame::before { /* soft bloom behind the border */
    content: ""; position: absolute; inset: -18px; z-index: -1; border-radius: 40px;
    background: inherit; filter: blur(28px); opacity: .45;
  }
  .frame-inner {
    position: relative; overflow: hidden;
    border-radius: 21px;
    background: #0d0d11;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 14px 14px;
    padding: clamp(10px, 2vw, 18px);
  }
  .frame-inner::after { /* glare that follows the cursor across the card */
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: radial-gradient(400px circle at var(--gx, 50%) var(--gy, 0%), rgba(255,255,255,.07), transparent 50%);
  }
  .cal {
    border-radius: 14px; overflow: hidden; background: #fff;
    min-height: 520px;
  }
  .cal iframe { display: block; width: 100%; border: none; overflow: hidden; min-height: 520px; }

  .note {
    margin-top: 26px; font-size: 13px; color: var(--muted);
    display: flex; gap: 22px; justify-content: center; flex-wrap: wrap;
  }
  .note span { display: inline-flex; align-items: center; gap: 8px; }
  .note i { width: 18px; height: 1px; background: linear-gradient(90deg, var(--red), var(--gold)); }

  footer {
    position: relative; z-index: 2; text-align: center;
    padding: 0 16px 40px; color: #4d4a52; font-size: 12px; letter-spacing: .08em;
  }

  @media (max-width: 600px) {
    .grid, .grid-hot { background-size: 40px 40px; }
    .frame-wrap { margin-top: 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    h1 .c, .sub, .frame-wrap { opacity: 1; filter: none; transform: none; }
    canvas#sparks { display: none; }
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="grid-hot"></div>
  <div class="glow"></div>
  <div class="vignette"></div>
  <canvas id="sparks"></canvas>

  <main>
    <div class="eyebrow"><span class="dot"></span>Calendar open</div>

    <h1 id="headline" data-text="Let's find a|*time to talk.*">Let's find a time to talk.</h1>

    <p class="sub">Pick a slot below. <b>20 minutes</b> for a quick question, <b>45 minutes</b> if we're mapping something out.</p>

    <div class="frame-wrap">
      <div class="frame" id="frame">
        <div class="frame-inner" id="frameInner">
          <div class="cal">
            <iframe src="https://link.gabeschillinger.com/widget/group/F3TeGz3BiEzcpjm1pIys" allow="payment" scrolling="no" id="F3TeGz3BiEzcpjm1pIys_1791761162132" title="Book a call with Gabe"></iframe>
          </div>
        </div>
      </div>
    </div>

    <div class="note">
      <span><i></i>Instant confirmation</span>
      <span><i></i>Your time zone, auto-detected</span>
    </div>
  </main>

  <footer>GABE SCHILLINGER</footer>

  <script src="https://link.gabeschillinger.com/js/form_embed.js" type="text/javascript"></script>
  <script>
  (() => {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const root = document.documentElement;

    /* ---- Headline: per-character blur/flip-in. "|" = line break, *...* = gradient italic ---- */
    const h1 = document.getElementById("headline");
    if (!reduce) {
      const raw = h1.dataset.text;
      let i = 0, html = "";
      raw.split("|").forEach((line, li) => {
        if (li) html += "<br>";
        line.split(/(\*[^*]+\*)/).forEach(seg => {
          if (!seg) return;
          const fancy = seg.startsWith("*");
          const text = fancy ? seg.slice(1, -1) : seg;
          const words = text.split(/(\s+)/).map(w => {
            if (/^\s+$/.test(w)) return w;
            return '<span class="w">' + [...w].map(ch =>
              `<span class="c" style="animation-delay:${(i++ * 0.035 + 0.15).toFixed(3)}s">${ch}</span>`
            ).join("") + "</span>";
          }).join("");
          html += fancy ? `<em>${words}</em>` : words;
        });
      });
      h1.innerHTML = html;
      // After the intro, collapse the gradient word back to plain text so the shine sweep runs across it as one piece
      setTimeout(() => h1.querySelectorAll("em").forEach(em => { em.textContent = em.textContent; }), (i * 35) + 1300);
      h1.setAttribute("aria-label", raw.replace(/[|*]/g, " ").replace(/\s+/g, " ").trim());
    }

    /* ---- Cursor: drives grid spotlight, card tilt + glare ---- */
    const frame = document.getElementById("frame");
    const inner = document.getElementById("frameInner");
    let tx = innerWidth / 2, ty = innerHeight * .3, cx = tx, cy = ty;
    addEventListener("pointermove", e => { tx = e.clientX; ty = e.clientY; }, { passive: true });

    /* ---- Ember sparks that drift up and get pushed away by the cursor ---- */
    const cv = document.getElementById("sparks");
    const ctx = cv.getContext("2d");
    let W, H, dpr, parts = [];
    const resize = () => {
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
      cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
      const n = Math.round(Math.min(90, innerWidth / 14));
      parts = Array.from({ length: n }, () => spawn(true));
    };
    const spawn = (anywhere) => ({
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + 10,
      vx: (Math.random() - .5) * .15 * dpr,
      vy: -(.15 + Math.random() * .45) * dpr,
      r: (.6 + Math.random() * 1.6) * dpr,
      hue: 15 + Math.random() * 30,
      life: Math.random() * Math.PI * 2,
    });
    addEventListener("resize", resize);
    resize();

    const tick = () => {
      cx += (tx - cx) * .12; cy += (ty - cy) * .12;
      root.style.setProperty("--mx", cx + "px");
      root.style.setProperty("--my", cy + "px");

      const r = frame.getBoundingClientRect();
      const px = (cx - r.left) / r.width, py = (cy - r.top) / r.height;
      inner.style.setProperty("--gx", (px * 100).toFixed(1) + "%");
      inner.style.setProperty("--gy", (py * 100).toFixed(1) + "%");

      if (!reduce) {
        ctx.clearRect(0, 0, W, H);
        const mx = cx * dpr, my = cy * dpr, R = 140 * dpr;
        for (const p of parts) {
          const dx = p.x - mx, dy = p.y - my, d = Math.hypot(dx, dy);
          if (d < R && d > 0) { const f = (1 - d / R) * .9; p.vx += dx / d * f * .25; p.vy += dy / d * f * .25; }
          p.vx *= .97; p.vy = p.vy * .97 + (-.25 * dpr) * .03;
          p.x += p.vx; p.y += p.vy; p.life += .03;
          if (p.y < -10 || p.x < -20 || p.x > W + 20) Object.assign(p, spawn(false));
          const a = .35 + Math.sin(p.life) * .25;
          ctx.beginPath();
          ctx.fillStyle = `hsla(${p.hue},100%,62%,${a})`;
          ctx.shadowColor = `hsla(${p.hue},100%,55%,.9)`;
          ctx.shadowBlur = 8 * dpr;
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
