<!-- GHL custom code version. Paste this whole file into a Custom JS/HTML element.
     Everything is scoped to #gb and breaks out of the column to full width. Nothing touches html/body. -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap");

  #gb {
    --bg: #07070a; --fg: #f4f2ee; --muted: #8d8a93;
    --line: rgba(255,255,255,.06); --line-hot: rgba(255,196,120,.55);
    --red: #ff3d2e; --gold: #ffb547;
    --mx: 50%; --my: 30%;
    /* break out of whatever GHL column we're in */
    position: relative; box-sizing: border-box;
    width: 100vw; margin-left: calc(50% - 50vw);
    min-height: 100vh; overflow: hidden; isolation: isolate;
    background: var(--bg); color: var(--fg);
    font-family: Inter, system-ui, sans-serif; line-height: 1.4;
    text-align: center; -webkit-font-smoothing: antialiased;
  }
  #gb *, #gb *::before, #gb *::after { box-sizing: border-box; }
  #gb h1, #gb p, #gb div, #gb span { margin: 0; padding: 0; }

  #gb .gb-grid, #gb .gb-hot, #gb .gb-glow, #gb .gb-vig, #gb canvas {
    position: absolute; inset: 0; pointer-events: none; z-index: 0; width: 100%; height: 100%;
  }
  #gb .gb-grid, #gb .gb-hot {
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 56px 56px; background-position: center top;
  }
  #gb .gb-hot {
    background-image: linear-gradient(var(--line-hot) 1px, transparent 1px), linear-gradient(90deg, var(--line-hot) 1px, transparent 1px);
    -webkit-mask-image: radial-gradient(260px circle at var(--mx) var(--my), #000 0%, transparent 70%);
            mask-image: radial-gradient(260px circle at var(--mx) var(--my), #000 0%, transparent 70%);
  }
  #gb .gb-glow { background: radial-gradient(600px circle at var(--mx) var(--my), rgba(255,120,60,.10), transparent 60%); }
  #gb .gb-vig { background: radial-gradient(ellipse at 50% 0%, transparent 30%, var(--bg) 85%); }
  #gb canvas { z-index: 1; }

  #gb .gb-main { position: relative; z-index: 2; max-width: 880px; margin: 0 auto; padding: clamp(48px, 10vh, 112px) 16px 80px; }
  #gb .gb-eyebrow {
    display: inline-flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.02);
  }
  #gb .gb-dot { width: 7px; height: 7px; border-radius: 50%; background: #3dff8a; animation: gb-ping 2s infinite; }
  @keyframes gb-ping { 0% { box-shadow: 0 0 0 0 rgba(61,255,138,.6); } 70%, 100% { box-shadow: 0 0 0 9px rgba(61,255,138,0); } }

  #gb h1 {
    margin-top: 28px; font-family: "Instrument Serif", Georgia, serif !important; font-weight: 400 !important;
    font-size: clamp(44px, 9vw, 96px) !important; line-height: .98 !important; letter-spacing: -.02em; color: var(--fg) !important; text-transform: none;
  }
  #gb h1 .gb-w { display: inline-block; white-space: pre; }
  #gb h1 .gb-c { display: inline-block; opacity: 0; filter: blur(14px); transform: translateY(.35em) rotateX(70deg); transform-origin: 50% 100%; animation: gb-in .9s cubic-bezier(.2,.7,.1,1) forwards; }
  #gb h1 em {
    font-style: italic; background: linear-gradient(100deg, var(--gold) 0%, #fff3d9 30%, var(--red) 55%, var(--gold) 80%);
    background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gb-shine 6s linear infinite;
  }
  #gb h1 em .gb-c { background: linear-gradient(100deg, var(--gold), #fff3d9, var(--red)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  @keyframes gb-in { to { opacity: 1; filter: blur(0); transform: none; } }
  @keyframes gb-shine { to { background-position: -250% 0; } }

  #gb .gb-sub { max-width: 520px; margin: 22px auto 0; color: var(--muted); font-size: clamp(16px, 2.2vw, 18px); line-height: 1.55; opacity: 0; filter: blur(8px); animation: gb-in 1s .9s forwards; }
  #gb .gb-sub b { color: var(--fg); font-weight: 500; }

  @property --gb-a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  #gb .gb-wrap { margin-top: 48px; opacity: 0; transform: translateY(30px); animation: gb-rise 1s 1.2s cubic-bezier(.2,.7,.1,1) forwards; }
  @keyframes gb-rise { to { opacity: 1; transform: none; } }
  #gb .gb-frame {
    position: relative; border-radius: 22px; padding: 1.5px;
    background: conic-gradient(from var(--gb-a), transparent 0deg, var(--red) 60deg, var(--gold) 110deg, transparent 170deg, transparent 360deg);
    animation: gb-spin 5s linear infinite;
  }
  @keyframes gb-spin { to { --gb-a: 360deg; } }
  #gb .gb-frame::before { content: ""; position: absolute; inset: -18px; z-index: -1; border-radius: 40px; background: inherit; filter: blur(28px); opacity: .45; }
  #gb .gb-inner {
    position: relative; overflow: hidden; border-radius: 21px; background: #0d0d11;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 14px 14px; padding: clamp(10px, 2vw, 18px);
  }
  #gb .gb-inner::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: radial-gradient(400px circle at var(--gx, 50%) var(--gy, 0%), rgba(255,255,255,.07), transparent 50%); }
  #gb .gb-cal { border-radius: 14px; overflow: hidden; background: #fff; min-height: 520px; }
  #gb .gb-cal iframe { display: block; width: 100%; border: none; overflow: hidden; min-height: 520px; }

  #gb .gb-note { margin-top: 26px; font-size: 13px; color: var(--muted); display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
  #gb .gb-note span { display: inline-flex; align-items: center; gap: 8px; }
  #gb .gb-note i { width: 18px; height: 1px; background: linear-gradient(90deg, var(--red), var(--gold)); }
  #gb .gb-foot { position: relative; z-index: 2; padding: 0 16px 40px; color: #4d4a52; font-size: 12px; letter-spacing: .08em; }

  @media (max-width: 600px) { #gb .gb-grid, #gb .gb-hot { background-size: 40px 40px; } #gb .gb-wrap { margin-top: 36px; } }
  @media (prefers-reduced-motion: reduce) {
    #gb *, #gb *::before, #gb *::after { animation: none !important; transition: none !important; }
    #gb h1 .gb-c, #gb .gb-sub, #gb .gb-wrap { opacity: 1; filter: none; transform: none; }
    #gb canvas { display: none; }
  }
</style>

<div id="gb">
  <div class="gb-grid"></div>
  <div class="gb-hot"></div>
  <div class="gb-glow"></div>
  <div class="gb-vig"></div>
  <canvas></canvas>

  <div class="gb-main">
    <div class="gb-eyebrow"><span class="gb-dot"></span>Calendar open</div>
    <h1 data-text="We said we'd talk.|*Let's actually do it.*">We said we'd talk. Let's actually do it.</h1>
    <p class="gb-sub">No more back-and-forth texting. Grab whatever works, <b>20 minutes</b> for a quick catch-up or <b>45</b> if we've got a lot to get into.</p>

    <div class="gb-wrap">
      <div class="gb-frame">
        <div class="gb-inner">
          <div class="gb-cal">
            <iframe src="https://link.gabeschillinger.com/widget/group/F3TeGz3BiEzcpjm1pIys" allow="payment" scrolling="no" id="F3TeGz3BiEzcpjm1pIys_1791761162132" title="Book a call with Gabe"></iframe>
          </div>
        </div>
      </div>
    </div>

    <div class="gb-note">
      <span><i></i>Lands on both our calendars</span>
      <span><i></i>Your time zone, auto-detected</span>
    </div>
  </div>
  <div class="gb-foot">GABE SCHILLINGER</div>
</div>

<script src="https://link.gabeschillinger.com/js/form_embed.js" type="text/javascript"></script>
<script>
(() => {
  const gb = document.getElementById("gb");
  if (!gb) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Headline: per-character blur/flip-in. "|" = line break, *...* = gradient italic */
  const h1 = gb.querySelector("h1");
  if (!reduce) {
    const raw = h1.dataset.text;
    let i = 0, html = "";
    raw.split("|").forEach((line, li) => {
      if (li) html += "<br>";
      line.split(/(\*[^*]+\*)/).forEach(seg => {
        if (!seg) return;
        const fancy = seg.startsWith("*");
        const text = fancy ? seg.slice(1, -1) : seg;
        const words = text.split(/(\s+)/).map(w => /^\s+$/.test(w) ? w :
          '<span class="gb-w">' + [...w].map(ch => `<span class="gb-c" style="animation-delay:${(i++ * 0.035 + 0.15).toFixed(3)}s">${ch}</span>`).join("") + "</span>").join("");
        html += fancy ? `<em>${words}</em>` : words;
      });
    });
    h1.innerHTML = html;
    setTimeout(() => h1.querySelectorAll("em").forEach(em => { em.textContent = em.textContent; }), (i * 35) + 1300);
    h1.setAttribute("aria-label", raw.replace(/[|*]/g, " ").replace(/\s+/g, " ").trim());
  }

  /* Cursor position is tracked relative to #gb, not the window */
  const frame = gb.querySelector(".gb-frame"), inner = gb.querySelector(".gb-inner");
  const cv = gb.querySelector("canvas"), ctx = cv.getContext("2d");
  let W, H, dpr, parts = [], tx = null, ty = null, cx = 0, cy = 0;
  const spawn = any => ({
    x: Math.random() * W, y: any ? Math.random() * H : H + 10,
    vx: (Math.random() - .5) * .15 * dpr, vy: -(.15 + Math.random() * .45) * dpr,
    r: (.6 + Math.random() * 1.6) * dpr, hue: 15 + Math.random() * 30, life: Math.random() * Math.PI * 2,
  });
  const resize = () => {
    const r = gb.getBoundingClientRect();
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = r.width * dpr; H = cv.height = r.height * dpr;
    const n = Math.round(Math.min(90, r.width / 14));
    parts = Array.from({ length: n }, () => spawn(true));
    if (tx === null) { tx = cx = r.width / 2; ty = cy = Math.min(r.height * .3, 260); }
  };
  addEventListener("pointermove", e => { const r = gb.getBoundingClientRect(); tx = e.clientX - r.left; ty = e.clientY - r.top; }, { passive: true });
  addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(gb);
  resize();

  const tick = () => {
    cx += (tx - cx) * .12; cy += (ty - cy) * .12;
    gb.style.setProperty("--mx", cx + "px"); gb.style.setProperty("--my", cy + "px");
    const g = gb.getBoundingClientRect(), f = frame.getBoundingClientRect();
    inner.style.setProperty("--gx", (((cx + g.left) - f.left) / f.width * 100).toFixed(1) + "%");
    inner.style.setProperty("--gy", (((cy + g.top) - f.top) / f.height * 100).toFixed(1) + "%");
    if (!reduce) {
      ctx.clearRect(0, 0, W, H);
      const mx = cx * dpr, my = cy * dpr, R = 140 * dpr;
      for (const p of parts) {
        const dx = p.x - mx, dy = p.y - my, d = Math.hypot(dx, dy);
        if (d < R && d > 0) { const k = (1 - d / R) * .9; p.vx += dx / d * k * .25; p.vy += dy / d * k * .25; }
        p.vx *= .97; p.vy = p.vy * .97 + (-.25 * dpr) * .03;
        p.x += p.vx; p.y += p.vy; p.life += .03;
        if (p.y < -10 || p.x < -20 || p.x > W + 20) Object.assign(p, spawn(false));
        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue},100%,62%,${.35 + Math.sin(p.life) * .25})`;
        ctx.shadowColor = `hsla(${p.hue},100%,55%,.9)`; ctx.shadowBlur = 8 * dpr;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
